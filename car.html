<!DOCTYPE html>  
<html lang="ar" dir="rtl">  
<head>  
<meta charset="UTF-8">  
<meta name="viewport" content="width=device-width, initial-scale=1.0">  
<title>تفاصيل السيارة</title>  
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">  

<style>  
:root {  
    --primary: #0f172a;  
    --accent: #d97706;  
    --bg: #f8fafc;  
    --radius: 16px;  
}  

* { box-sizing: border-box; }  

body {  
    margin: 0;  
    font-family: 'Tajawal', sans-serif;  
    background: var(--bg);  
    color: #334155;  
    overflow-x: hidden;  
}  

.topbar {  
    background: var(--primary);  
    padding: 15px 5%;  
    color: white;  
    display: flex;  
    justify-content: space-between;  
    align-items: center;  
}  

.logo {  
    font-size: 26px;  
    font-weight: 800;  
    text-decoration: none;  
    color: white;  
}  

.logo span { color: var(--accent); }  

.product-container {  
    width: 90%;  
    max-width: 1000px;  
    margin: 40px auto;  
    padding: 30px;  
    display: grid;  
    grid-template-columns: 1.2fr 1fr;  
    gap: 40px;  
    background: white;  
    border-radius: var(--radius);  
}  

.product-container > div { min-width: 0; }  

.main-image {  
    width: 100%;  
    height: 350px;  
    object-fit: cover;  
    border-radius: 12px;  
    cursor: zoom-in;  
}  

.thumbs {  
    display: flex;  
    gap: 10px;  
    overflow-x: auto;  
}  

.thumbs img {  
    width: 80px;  
    height: 60px;  
    object-fit: cover;  
    cursor: pointer;  
    border-radius: 8px;  
    opacity: 0.7;  
}  

.thumbs img.active {  
    border: 2px solid var(--accent);  
    opacity: 1;  
}  

.product-info h1 {  
    font-size: 2em;  
    color: var(--primary);  
}  

.price-tag {  
    background: var(--accent);  
    color: white;  
    padding: 8px 15px;  
    display: inline-block;  
    border-radius: 8px;  
    font-weight: bold;  
}  

.description {  
    margin-top: 15px;  
    background: #f1f5f9;  
    padding: 15px;  
    border-radius: 8px;  
}  

.actions {  
    display: flex;  
    gap: 15px;  
    margin-top: 25px;  
}  

.btn {  
    flex: 1;  
    padding: 15px;  
    text-align: center;  
    text-decoration: none;  
    border-radius: 8px;  
    font-weight: bold;  
}  

.contact { background: var(--primary); color: white; }  
.back { background: #e2e8f0; color: black; }  

.modal {  
    display: none;  
    position: fixed;  
    width: 100%;  
    height: 100%;  
    background: rgba(0,0,0,0.9);  
    justify-content: center;  
    align-items: center;  
}  

.modal img {  
    max-width: 90%;  
    max-height: 90%;  
}  
</style>  
</head>  

<body>  

<header class="topbar">  
    <a class="logo" href="index.html">eye<span>find</span>.info</a>  
    <span>تفاصيل السيارة</span>  
</header>  

<main class="product-container">  

    <div>  
        <img id="mainImg" class="main-image" onclick="openModal()">  
        <div class="thumbs" id="thumbs"></div>  
    </div>  

    <div class="product-info">  
        <h1 id="carName"></h1>  
        <div class="price-tag" id="price"></div>  
        <p class="description" id="desc"></p>  

        <table>  
            <tr><td>سنة الصنع</td><td id="year"></td></tr>  
            <tr><td>الحالة</td><td id="condition"></td></tr>  
            <tr><td>المحرك</td><td id="engine"></td></tr>  
        </table>  

        <div class="actions">  
            <a id="contactBtn" class="btn contact" target="_blank">تواصل معنا الآن</a>  
            <a href="index.html" class="btn back">رجوع</a>  
        </div>  
    </div>  

</main>  

<div id="imageModal" class="modal" onclick="closeModal()">  
    <img id="fullImg">  
</div>  

<script>  
let cars = JSON.parse(localStorage.getItem("cars")) || [];  
let i = localStorage.getItem("selectedCar");  
let car = cars[i];  

if(car){  
    document.getElementById("carName").innerText = car.name;  
    document.getElementById("price").innerText = car.price + " درهم";  
    document.getElementById("desc").innerText = car.description;  
    document.getElementById("year").innerText = car.year;  
    document.getElementById("condition").innerText = car.condition;  
    document.getElementById("engine").innerText = car.engine;  

    const mainImg = document.getElementById("mainImg");  
    mainImg.src = car.images?.[0];  

    let thumbs = document.getElementById("thumbs");  

    (car.images || []).forEach((img, idx)=>{  
        let t = document.createElement("img");  
        t.src = img;  
        if(idx === 0) t.classList.add("active");  

        t.onclick = () => {  
            mainImg.src = img;  
            document.querySelectorAll(".thumbs img").forEach(x => x.classList.remove("active"));  
            t.classList.add("active");  
        };  

        thumbs.appendChild(t);  
    });  

    // 🔥 زر واتساب برسالة تلقائية
    const phone = "212727028813"; // غيره
    const message = `اريد تفاصيل سيارة ${car.name}، من فضلك.`;

    document.getElementById("contactBtn").href =
        `https://wa.me/${phone}?text=${encodeURIComponent(message)}`;
}  

function openModal(){  
    document.getElementById("fullImg").src = document.getElementById("mainImg").src;  
    document.getElementById("imageModal").style.display = "flex";  
}  

function closeModal(){  
    document.getElementById("imageModal").style.display = "none";  
}  
</script>  

</body>  
</html>
