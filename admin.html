<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إدارة eyefind</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root {
    --primary: #0f172a;
    --accent: #d97706;
    --bg: #f1f5f9;
}
* { box-sizing: border-box; }

body{
    margin:0;
    font-family: 'Tajawal', sans-serif;
    background: var(--bg);
    overflow-x: hidden;
}

.topbar{
    background: var(--primary);
    color:white;
    padding:15px 5%;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{ font-size:24px; font-weight:800; }
.logo span { color: var(--accent); }

.topbar button {
    background: transparent; border: 1px solid white; color: white;
    padding: 8px 15px; border-radius: 8px; cursor: pointer; transition: 0.3s;
}
.topbar button:hover { background: white; color: var(--primary); }

.container{
    max-width:800px;
    margin: 40px auto;
    padding: 0 20px;
}

.panel{
    background: white;
    padding: 30px;
    border-radius: 16px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    border: 1px solid #e2e8f0;
}

input, textarea{
    width: 100%;
    padding: 14px;
    margin-top: 15px;
    border: 2px solid #e2e8f0;
    border-radius: 8px;
    font-family: inherit;
    font-size: 1em;
    transition: 0.3s;
    background: #f8fafc;
}

input:focus, textarea:focus {
    border-color: var(--primary);
    outline: none;
    background: white;
}

.btn-main {
    width: 100%;
    padding: 15px;
    margin-top: 20px;
    background: var(--primary);
    color: white;
    border: none;
    border-radius: 8px;
    font-weight: 700;
    font-size: 1.1em;
    cursor: pointer;
    transition: 0.3s;
    font-family: inherit;
}
.btn-main:hover { background: var(--accent); }

.item {
    background: white;
    margin-top: 20px;
    padding: 20px;
    border-radius: 16px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    border: 1px solid #e2e8f0;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 15px;
}

.item img {
    width: 120px;
    height: 90px;
    object-fit: cover;
    border-radius: 8px;
}

.item-info {
    flex: 1;
    min-width: 200px;
}
.item-info h3 { margin: 0 0 5px 0; color: var(--primary); }
.item-info p { margin: 0; font-weight: bold; color: var(--accent); }

.actions-group {
    display: flex; gap: 10px; flex-wrap: wrap;
}

.actions-group button {
    padding: 10px 15px; border: none; border-radius: 6px; font-weight: bold;
    cursor: pointer; font-family: inherit; transition: 0.3s;
}
.edit { background: #fef08a; color: #854d0e; }
.edit:hover { background: #fde047; }
.del { background: #fecaca; color: #991b1b; }
.del:hover { background: #fca5a5; }

/* شاشة تسجيل دخول احترافية مع تأثير ضبابي */
#loginScreen {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(15, 23, 42, 0.8);
    backdrop-filter: blur(8px);
    display: flex; justify-content: center; align-items: center; z-index: 1000;
}
#loginScreen .panel {
    width: 350px; text-align: center; background: white; border: none;
}
</style>
</head>
<body>

<div id="loginScreen">
    <div class="panel">
        <h2 style="color:var(--primary);">الوصول للإدارة</h2>
        <input id="adminUser" placeholder="اسم المستخدم">
        <input id="adminPass" type="password" placeholder="كلمة المرور">
        <button class="btn-main" onclick="login()">دخول</button>
    </div>
</div>

<div class="topbar">
    <div class="logo">eye<span>find</span> الإدارة</div>
    <button onclick="location.href='index.html'">الرئيسية</button>
</div>

<div class="container">
    <div class="panel">
        <h2 style="margin-top:0; color:var(--primary); border-bottom: 2px solid #e2e8f0; padding-bottom: 10px;">إضافة / تعديل سيارة</h2>
        
        <input id="carName" placeholder="اسم السيارة (مثال: مرسيدس G-Class)">
        <input id="price" placeholder="السعر (اكتب الأرقام فقط)">
        <textarea id="desc" placeholder="وصف مميزات السيارة" rows="3"></textarea>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <input id="year" placeholder="سنة الصنع">
            <input id="condition" placeholder="الحالة">
            <input id="seats" placeholder="عدد المقاعد">
            <input id="engine" placeholder="المحرك">
            <input id="mileage" placeholder="المسافة المقطوعة">
            <input id="color" placeholder="اللون">
        </div>

        <input type="file" id="imgs" multiple accept="image/*" style="padding: 10px; background:white;">
        <button class="btn-main" onclick="addCar()">حفظ بيانات السيارة</button>
    </div>

    <div id="list"></div>
</div>

<script>
function login() {
    let user = document.getElementById("adminUser").value;
    let pass = document.getElementById("adminPass").value;
    if(user === "admin" && pass === "1234") {
        document.getElementById("loginScreen").style.display = "none";
    } else { alert("بيانات الدخول غير صحيحة!"); }
}

let cars = JSON.parse(localStorage.getItem("cars")) || [];
let editIndex = null;

function save(){ localStorage.setItem("cars",JSON.stringify(cars)); }

function addCar(){
    const files = document.getElementById("imgs").files;
    function finish(images){
        const car = {
            name: document.getElementById("carName").value,
            price: document.getElementById("price").value,
            description: document.getElementById("desc").value,
            year: document.getElementById("year").value,
            condition: document.getElementById("condition").value,
            seats: document.getElementById("seats").value,
            engine: document.getElementById("engine").value,
            mileage: document.getElementById("mileage").value,
            color: document.getElementById("color").value,
            images: images
        };

        if(editIndex === null){ cars.push(car); }
        else {
            if(images.length === 0 && cars[editIndex].images) { car.images = cars[editIndex].images; }
            cars[editIndex] = car; editIndex = null;
        }
        save(); load(); clear();
    }

    if(files.length > 0){
        let images = []; let done = 0;
        for(let f of files){
            let reader = new FileReader();
            reader.onload = (e)=>{ images.push(e.target.result); done++; if(done === files.length) finish(images); };
            reader.readAsDataURL(f);
        }
    } else { finish([]); }
}

function load(){
    let list = document.getElementById("list"); list.innerHTML = "";
    cars.forEach((c,i)=>{
        list.innerHTML += `
        <div class="item">
            <img src="${c.images?.[0] || ''}">
            <div class="item-info">
                <h3>${c.name}</h3>
                <p>${c.price ? c.price + " درهم" : ""}</p>
            </div>
            <div class="actions-group">
                <button class="edit" onclick="editCar(${i})">تعديل</button>
                <button class="del" onclick="deleteCar(${i})">حذف</button>
            </div>
        </div>
        `;
    });
}

function editCar(i){
    let c = cars[i];
    document.getElementById("carName").value = c.name; document.getElementById("price").value = c.price;
    document.getElementById("desc").value = c.description; document.getElementById("year").value = c.year;
    document.getElementById("condition").value = c.condition; document.getElementById("seats").value = c.seats;
    document.getElementById("engine").value = c.engine; document.getElementById("mileage").value = c.mileage;
    document.getElementById("color").value = c.color;
    editIndex = i;
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function deleteCar(i){
    if(confirm("تأكيد حذف السيارة؟")) { cars.splice(i,1); save(); load(); }
}

function clear(){
    ["carName","price","desc","year","condition","seats","engine","mileage","color","imgs"].forEach(id => document.getElementById(id).value = "");
}

load();
</script>
</body>
</html>
