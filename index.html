<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سيارات Eyefind | الفخامة</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root {
    --primary: #0f172a; 
    --accent: #d97706; 
    --bg: #f8fafc; 
    --card-bg: #ffffff;
    --text: #334155;
    --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
    --radius: 16px;
}

* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: 'Tajawal', sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow-x: hidden;
}

.topbar {
    background: var(--primary);
    color: white;
    padding: 15px 5%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
}

.logo {
    font-size: 30px;
    font-weight: 800;
    letter-spacing: 1px;
}

.logo span {
    color: var(--accent);
}

.topbar button {
    background: transparent;
    border: 1px solid rgba(255,255,255,0.3);
    color: white;
    padding: 8px 20px;
    border-radius: 8px;
    transition: 0.3s;
    cursor: pointer;
    font-family: inherit;
    font-weight: bold;
}

.topbar button:hover {
    background: white;
    color: var(--primary);
}

.container {
    padding: 30px 5%;
    max-width: 1200px;
    margin: auto;
}

.banner {
    background: linear-gradient(135deg, var(--primary) 0%, #1e293b 100%);
    color: white;
    padding: 50px 30px;
    border-radius: var(--radius);
    text-align: center;
    box-shadow: var(--shadow);
    margin-bottom: 40px;
}

.banner h1 {
    margin: 0 0 10px 0;
    font-size: 2.5em;
    font-weight: 800;
}

.banner p {
    margin: 0;
    font-size: 1.2em;
    color: #cbd5e1;
}

.cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 25px;
}

.card {
    background: var(--card-bg);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    border: 1px solid #e2e8f0;
}

.card:hover {
    transform: translateY(-8px);
    box-shadow: var(--shadow);
}

.card-slider {
    display: flex;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    scrollbar-width: none;
    border-bottom: 4px solid var(--accent);
}

.card-slider::-webkit-scrollbar { display: none; }

.card-slider img {
    width: 100%;
    height: 220px;
    object-fit: cover;
    flex: 0 0 100%;
    scroll-snap-align: start;
}

.card-content {
    padding: 20px;
}

.card-content h3 {
    margin: 0 0 10px 0;
    color: var(--primary);
    font-size: 1.4em;
    font-weight: 700;
}

.price {
    font-weight: 800;
    font-size: 1.2em;
    color: var(--accent);
    background: #fef3c7;
    padding: 5px 12px;
    border-radius: 8px;
    display: inline-block;
    margin-bottom: 15px;
}

.card-content button {
    width: 100%;
    padding: 12px;
    background: var(--primary);
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 700;
    font-family: inherit;
    font-size: 1.1em;
    transition: 0.3s;
}

.card-content button:hover {
    background: var(--accent);
}

.footer {
    margin-top: 50px;
    text-align: center;
    padding: 20px;
    border-top: 1px solid #e2e8f0;
}

.footer a {
    color: var(--primary);
    text-decoration: none;
    font-weight: 700;
    transition: 0.3s;
}

.footer a:hover {
    color: var(--accent);
}

/* ======== نافذة تسجيل الدخول (اللائحة المنبثقة) ======== */
#adminModal {
    display: none; /* مخفية افتراضياً */
    position: fixed;
    z-index: 9999;
    left: 0; 
    top: 0;
    width: 100%; 
    height: 100%;
    background-color: rgba(15, 23, 42, 0.85); /* لون داكن مع شفافية */
    backdrop-filter: blur(5px); /* تأثير ضبابي للخلفية */
    align-items: center;
    justify-content: center;
}

.admin-panel {
    background: white;
    padding: 35px 30px;
    border-radius: 16px;
    width: 90%;
    max-width: 360px;
    text-align: center;
    position: relative;
    box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
}

.close-btn {
    position: absolute;
    top: 15px;
    right: 20px;
    background: transparent;
    border: none;
    font-size: 28px;
    color: #64748b;
    cursor: pointer;
    line-height: 1;
    transition: 0.2s;
}

.close-btn:hover {
    color: #ef4444; /* يتحول للأحمر عند التمرير */
    transform: scale(1.1);
}

.admin-panel input {
    width: 100%;
    padding: 14px;
    margin-top: 15px;
    border: 2px solid #e2e8f0;
    border-radius: 8px;
    font-family: inherit;
    font-size: 1em;
    transition: 0.3s;
    background: #f8fafc;
    outline: none;
}

.admin-panel input:focus {
    border-color: var(--primary);
    background: white;
}

.btn-login {
    width: 100%;
    padding: 14px;
    margin-top: 20px;
    background: var(--primary);
    color: white;
    border: none;
    border-radius: 8px;
    font-weight: 700;
    font-size: 1.1em;
    cursor: pointer;
    transition: 0.3s;
    font-family: inherit;
}

.btn-login:hover {
    background: var(--accent);
}
</style>
</head>
<body>

<div class="topbar">
    <div class="logo">eye<span>find</span>.info</div>
    <button onclick="openAdminModal()">لوحة التحكم</button>
</div>

<div class="container">
    <div class="banner">
        <h1>مرحباً بك في عالم الفخامة</h1>
        <p>المكان الأفضل لاكتشاف وامتلاك سيارات النخبة</p>
    </div>

    <div class="cards" id="cars"></div>

    <div class="footer">
        <a href="terms.html">جميع الحقوق محفوظة © 2026 eyefind.info</a>
    </div>
</div>

<div id="adminModal">
    <div class="admin-panel">
        <button class="close-btn" onclick="closeAdminModal()">&times;</button>
        <h2 style="color:var(--primary); margin:0 0 10px 0;">دخول الإدارة</h2>
        <input id="loginUser" placeholder="اسم المستخدم">
        <input id="loginPass" type="password" placeholder="كلمة المرور">
        <button class="btn-login" onclick="goToAdmin()">تسجيل الدخول</button>
    </div>
</div>

<script>
const cars = JSON.parse(localStorage.getItem("cars")) || [];
const container = document.getElementById("cars");

function load(){
    container.innerHTML = "";
    cars.forEach((c,i)=>{
        let imagesHTML = '';
        if(c.images && c.images.length > 0) {
            c.images.forEach(imgUrl => { imagesHTML += `<img src="${imgUrl}">`; });
        } else {
            imagesHTML = `<img src="">`;
        }

        container.innerHTML += `
        <div class="card">
            <div class="card-slider">${imagesHTML}</div>
            <div class="card-content">
                <h3>${c.name}</h3>
                <div class="price">${c.price ? c.price + " درهم" : "السعر غير محدد"}</div>
                <button onclick="openCar(${i})">عرض التفاصيل</button>
            </div>
        </div>
        `;
    });
}

function openCar(i){
    localStorage.setItem("selectedCar",i);
    location.href="car.html";
}

// ==== دوال اللائحة المنبثقة (Modal) ====

function openAdminModal() {
    document.getElementById("adminModal").style.display = "flex";
    // تجميد الصفحة الخلفية لمنع التمرير
    document.body.style.overflow = "hidden";
}

function closeAdminModal() {
    document.getElementById("adminModal").style.display = "none";
    // إعادة تفعيل التمرير في الصفحة الخلفية
    document.body.style.overflow = "auto";
}

function goToAdmin() {
    let user = document.getElementById("loginUser").value;
    let pass = document.getElementById("loginPass").value;
    
    // التحقق من بيانات الدخول
    if(user === "admin" && pass === "1234") {
        location.href = "admin.html";
    } else {
        alert("بيانات الدخول غير صحيحة!");
    }
}

// إغلاق النافذة عند الضغط على الخلفية الضبابية (خارج اللائحة)
window.onclick = function(event) {
    const modal = document.getElementById("adminModal");
    if (event.target === modal) {
        closeAdminModal();
    }
}

load();
</script>
</body>
</html>
